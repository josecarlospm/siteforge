<div class="sf-studio-app">
  <header class="sf-studio-nav">
    <div class="sf-container nav-inner">
      <button type="button" class="nav-brand" (click)="setTab('portal')">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">SiteForge</span>
      </button>

      <nav class="nav-tabs" aria-label="Studio views">
        <button
          type="button"
          class="nav-tab-btn"
          [class.active]="activeTab() === 'portal'"
          (click)="setTab('portal')"
        >
          Factory
        </button>
        <button
          type="button"
          class="nav-tab-btn"
          [class.active]="activeTab() === 'showcase'"
          (click)="setTab('showcase')"
        >
          Reference
        </button>
        <button
          type="button"
          class="nav-tab-btn"
          [class.active]="activeTab() === 'telemetry'"
          (click)="setTab('telemetry')"
        >
          Diagnostics
        </button>
      </nav>

      <div class="nav-meta" aria-hidden="true">
        <span class="nav-meta-label">Enterprise factory</span>
      </div>
    </div>
  </header>

  @if (activeTab() === 'portal') {
    <sf-factory-portal />
  }

  @if (activeTab() === 'telemetry') {
    <div class="sf-container telemetry-container">
      <sf-cto-telemetry />
    </div>
  }

  <div [style.display]="activeTab() === 'showcase' ? 'block' : 'none'">
    <sf-plantcare-showcase />
  </div>
</div>
